name: usage-metering

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@db:5432/${POSTGRES_DB:-metering}
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      AUTO_MIGRATE: "true"
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Runs the end-to-end demo once against the API, prints the decisions, then exits.
  client:
    build: .
    command: ["node", "dist/src/client/cli.js", "demo"]
    environment:
      API_URL: http://api:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
    depends_on:
      api:
        condition: service_healthy
    # The image's HEALTHCHECK probes the API port, which the one-shot client does not serve.
    healthcheck:
      disable: true
    restart: "no"

volumes:
  pgdata:
